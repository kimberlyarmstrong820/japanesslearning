<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本語練習</title>
<style>
  :root {
    --bg-top: #fdf1f3; --bg-bot: #f7efe2;
    --card: rgba(255, 252, 248, 0.88); --ink: #2a2421; --muted: #7a6f68;
    --line: #ecdcd6; --accent: #b83a3a; --accent-ink: #fff; --hl: #ffe3a3;
    --sakura: #f6b9c8; --sakura-deep: #e98aa3;
    --hill-far: #e9d3d6; --hill-near: #dcc2c4;
    --castle-wall: #fffaf3; --castle-roof: #4a4f5c; --castle-stone: #a59a91;
    --cal-done: #fff3f5; --cal-empty: rgba(255,255,255,.45);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-top: #141a2e; --bg-bot: #231c2a;
      --card: rgba(30, 28, 38, 0.88); --ink: #efe9e4; --muted: #a9a0a8;
      --line: #3b3545; --accent: #ef7b7b; --accent-ink: #1b1620; --hl: #6b4e14;
      --sakura: #c98a9c; --sakura-deep: #b06b80;
      --hill-far: #2a2840; --hill-near: #211f33;
      --castle-wall: #d8d2cc; --castle-roof: #3a3f52; --castle-stone: #4d4752;
      --cal-done: rgba(239,123,123,.12); --cal-empty: rgba(255,255,255,.04);
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg-bot); }
  body { margin: 0; min-height: 100vh; color: var(--ink);
         background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 70%) fixed;
         font: 17px/1.75 "Hiragino Sans", "Noto Sans JP", "Noto Sans TC", system-ui, sans-serif; }

  /* ---- 背景：城 + 櫻花 ---- */
  .scene { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .scene svg.land { position: absolute; left: 0; bottom: 0; width: 100%; height: 42vh; min-height: 220px; }
  .scene svg.branch { position: absolute; top: -10px; right: -20px; width: min(46vw, 360px); }
  .scene svg.branch.left { right: auto; left: -30px; transform: scaleX(-1); width: min(34vw, 260px); top: 30vh; opacity: .8; }
  .moon { position: absolute; top: 9vh; left: 12vw; width: 70px; height: 70px; border-radius: 50%;
          background: radial-gradient(circle at 40% 40%, #fff8e8, #f5d9a8); opacity: 0; }
  @media (prefers-color-scheme: dark) { .moon { opacity: .9; box-shadow: 0 0 40px rgba(255,236,190,.35); } }
  .petal { position: absolute; top: -5vh; width: 12px; height: 10px; background: var(--sakura);
           border-radius: 12px 1px 12px 1px; opacity: .85; animation: fall linear infinite; }
  @keyframes fall {
    0%   { transform: translate(0, -5vh) rotate(0deg); }
    50%  { transform: translate(-6vw, 50vh) rotate(200deg); }
    100% { transform: translate(4vw, 110vh) rotate(420deg); }
  }
  @media (prefers-reduced-motion: reduce) { .petal { display: none; } }

  main { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 16px 16px 30vh; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  h1 { font-size: 1.5rem; margin: 8px 0; letter-spacing: .05em; }
  h1 a { color: inherit; text-decoration: none; }
  h1 .mon { color: var(--accent); }
  h2 { font-size: 1.1rem; margin: 0 0 8px; color: var(--accent); }
  select, button, input { font: inherit; }
  select { max-width: 100%; }
  select, button { border: 1px solid var(--line); background: var(--card); color: var(--ink);
                   border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
            padding: 16px; margin: 14px 0;
            -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
            box-shadow: 0 2px 10px rgba(120, 60, 70, .06); }
  .muted { color: var(--muted); font-size: .9rem; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border-bottom: 1px solid var(--line); padding: 6px 4px; text-align: left; vertical-align: top; }
  .speak { border: none; background: none; padding: 0 4px; cursor: pointer; font-size: 1rem; }
  rt { font-size: .55em; color: var(--muted); }
  body.no-furigana rt { display: none; }
  .passage .s { cursor: pointer; border-radius: 4px; transition: background .2s; }
  .passage .s:hover { background: color-mix(in srgb, var(--hl) 50%, transparent); }
  .passage .s.on { background: var(--hl); }
  .passage { font-size: 1.15rem; line-height: 2.3; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .controls label { display: flex; gap: 6px; align-items: center; font-size: .9rem; }
  ol { padding-left: 1.4em; margin: 6px 0; }
  li { margin: 4px 0; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--accent); }
  .warn { position: relative; z-index: 1; background: #fff3cd; color: #5c4400; padding: 8px 12px; border-radius: 8px; font-size: .9rem; }
  a { color: var(--accent); }

  /* ---- 月曆 ---- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .cal-head h2 { margin: 0; font-size: 1.25rem; }
  .cal { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .cal .dow { text-align: center; font-weight: 600; color: var(--muted); font-size: .9rem; }
  .cal .cell { min-height: 76px; border-radius: 10px; padding: 6px; background: var(--cal-empty);
               border: 1px solid var(--line); font-size: .8rem; line-height: 1.35;
               display: flex; flex-direction: column; gap: 2px; color: var(--muted);
               text-decoration: none; overflow: hidden; }
  .cal .cell .d { font-weight: 700; font-size: .95rem; color: var(--ink); }
  .cal .cell.out { visibility: hidden; }
  .cal .cell.done { background: var(--cal-done); color: var(--ink); border-color: var(--sakura);
                    cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .cal .cell.done:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(184,58,58,.15); }
  .cal .cell.done .d::after { content: " 🌸"; font-size: .8rem; }
  .cal .cell.today { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cal .cell .t { word-break: break-all; }
  .cal .cell .g { color: var(--accent); font-size: .75rem; }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; font-size: .9rem; color: var(--muted); }
  .stats b { color: var(--accent); font-size: 1.2rem; }
  .list a { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line);
            color: var(--ink); text-decoration: none; }
  .list a:last-child { border-bottom: none; }
  .list .dt { color: var(--muted); min-width: 6.6em; font-variant-numeric: tabular-nums; }
  .list .gp { margin-left: auto; color: var(--accent); font-size: .85rem; white-space: nowrap; }

  /* ---- JLPT N3 進度 ---- */
  .bar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; margin: 6px 0 10px; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
  .n3 { display: grid; grid-template-columns: 3em minmax(0, 1fr) minmax(0, 1.2fr); gap: 2px 10px; font-size: .9rem; }
  .n3 > * { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .n3 .no { color: var(--muted); font-variant-numeric: tabular-nums; }
  .n3 .done { color: var(--accent); font-weight: 600; }
  .n3 .next { outline: 2px dashed var(--sakura-deep); outline-offset: 1px; border-radius: 4px; }
  .n3 .m { color: var(--muted); }
  .badge { display: inline-block; font-size: .75rem; padding: 1px 8px; border-radius: 10px; margin-left: 6px;
           background: var(--accent); color: var(--accent-ink); vertical-align: middle; font-weight: 600; }
  .ref { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--cal-done); border: 1px dashed var(--sakura); }

  /* ---- 每日頁 ---- */
  .nav { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  .nav a, .nav span { padding: 6px 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--line);
                      text-decoration: none; color: var(--ink); font-size: .9rem; }
  .nav span { opacity: .35; }
  .en-title { display: block; font-size: .95rem; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .tabs { display: flex; gap: 6px; margin: 14px 0 0; }
  .tabs a { flex: 1; text-align: center; padding: 8px 12px; border-radius: 10px; text-decoration: none;
            background: var(--card); border: 1px solid var(--line); color: var(--ink); font-weight: 600; }
  .tabs a.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .passage.en { font-size: 1.12rem; line-height: 2; }
  .cal .cell .e { color: var(--muted); font-size: .72rem; }
  @media (max-width: 480px) {
    .cal .cell { min-height: 64px; padding: 4px; font-size: .68rem; }
    .cal .cell .g { display: none; }
    .cal .cell .e { display: none; }
    .cal .cell .d { font-size: .85rem; }
    .list .gp { display: none; }
  }
</style>
</head>
<body>
<div class="scene" aria-hidden="true">

        <rect x="806" y="158" width="6" height="7"/><rect x="828" y="158" width="6" height="7"/>

      <circle cx="330" cy="262" r="30"/><circle cx="365" cy="250" r="34"/><circle cx="400" cy="266" r="26"/>

</div>

<main>
  <header>
    <h1><a href="#">日本語<span class="mon">練習</span></a></h1>
    <div class="controls" style="margin:0">
      <button id="testVoice" type="button">🔈 測試聲音</button>
      <label><input type="checkbox" id="furi" checked> 振假名</label>
    </div>
  </header>

  <div id="nospeech" class="warn" hidden>呢個瀏覽器唔支援朗讀（Web Speech API）。試吓用 Chrome、Edge 或 Safari。</div>
  <div id="speechStatus" class="warn" hidden></div>
  <div id="view"></div>
</main>

<script src="data/lessons.js"></script>
<script src="data/n3.js"></script>
<script>
// ---------- 振假名 / 朗讀用文字 ----------
const KANJI = "[\\u4E00-\\u9FFF\\u3400-\\u4DBF々〆ヶ]";
const READ = "[\\u3041-\\u3096ー]";
const FURI_RE = new RegExp(`(${KANJI}+)（(${READ}+)）`, "g");

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// 「花火（はなび）」→ <ruby>花火<rt>はなび</rt></ruby>
function ruby(text) {
  return esc(text).replace(FURI_RE, "<ruby>$1<rt>$2</rt></ruby>");
}
// 朗讀時用括號入面嘅讀音代替漢字，發音會更準：「花火（はなび）」→「はなび」
function speechText(text) {
  return text.replace(FURI_RE, "$2");
}
// 用「。」「！」「？」分句；英文就用 . ! ?
function sentences(text, lang = "ja") {
  const re = lang === "en" ? /[^.!?]+[.!?]+["'’”)]?/g : /[^。！？]+[。！？]?/g;
  return text.match(re)?.map(s => s.trim()).filter(Boolean) ?? [];
}

// ---------- 朗讀 ----------
const synth = window.speechSynthesis;
const voice = { ja: null, en: null };
let rate = 0.9;
let shadow = false;    // 跟讀模式：每句讀完停一停，俾你跟住講

function pickVoice() {
  if (!synth) return;
  const all = synth.getVoices();
  const norm = v => v.lang.replace("_", "-").toLowerCase();
  const ja = all.filter(v => norm(v).startsWith("ja"));
  voice.ja = ja.find(v => /google|kyoko|otoya|nanami|haruka/i.test(v.name)) || ja[0] || null;
  // 英式英文：自己揀過就用返嗰把；否則優先「英國女聲」，越自然越好
  const en = enVoices();
  let saved = null;
  try { saved = localStorage.getItem("enVoice"); } catch (e) {}
  voice.en = en.find(v => v.name === saved)
    || en.slice().sort((a, b) => voiceScore(b) - voiceScore(a))[0] || null;
}

// 英國女聲（Edge／Windows、Chrome、Mac／iPhone 常見嘅名）
const GB_FEMALE = /sonia|libby|maisie|abbi|bella|hollie|olivia|hazel|susan|serena|kate|stephanie|martha|fiona|google uk english female|\bfemale/i;
const GB_MALE = /daniel|ryan|thomas|oliver|george|arthur|alfie|elliot|ethan|noah|google uk english male|\bmale\b/i;
const NATURAL = /natural|neural|online|enhanced|premium|siri/i;

function enVoices() {
  const all = synth ? synth.getVoices() : [];
  const norm = v => v.lang.replace("_", "-").toLowerCase();
  const gb = all.filter(v => norm(v) === "en-gb");
  return gb.length ? gb : all.filter(v => norm(v).startsWith("en"));
}
function isFemale(v) { return GB_FEMALE.test(v.name) && !GB_MALE.test(v.name.replace(/female/i, "")); }
function voiceScore(v) {
  const gb = /en[-_]gb/i.test(v.lang) ? 100 : 0;
  const female = isFemale(v) ? 50 : GB_MALE.test(v.name) ? -50 : 0;
  return gb + female + (NATURAL.test(v.name) ? 20 : 0) + (v.localService ? 0 : 5);
}
// 英文頁嘅「聲音」選單
function voiceMenu() {
  const list = enVoices();
  if (!list.length) return "";
  return `<label>聲音 <select id="enVoice">${list.map(v =>
    `<option value="${esc(v.name)}" ${voice.en && v.name === voice.en.name ? "selected" : ""}>${isFemale(v) ? "♀ " : GB_MALE.test(v.name) ? "♂ " : ""}${esc(v.name.replace(/^Microsoft |\s*-\s*English \(United Kingdom\)|\s*\(English \(United Kingdom\)\)/g, ""))}</option>`).join("")}</select></label>`;
}
if (synth) {
  pickVoice();
  synth.onvoiceschanged = () => { pickVoice(); refreshVoiceMenu(); };
} else {
  document.getElementById("nospeech").hidden = false;
}

// 一次只放一句入語音引擎，讀完先放下一句。
// （一次過排晒全部句子，iPhone Safari / Chrome 好多時讀完第一句就冇聲，cancel 亦唔靈。）
let playId = 0;        // 每次撳「讀」或「停」都加一，舊嘅播放就會自動停
let current = null;    // 保留住而家嗰句，避免被瀏覽器回收（Chrome 會因此唔觸發 onend）
let watchdog = null;

function clearWatchdog() { if (watchdog) { clearInterval(watchdog); watchdog = null; } }

// 讀一句；讀完（或者出錯、或者瀏覽器冇通知但其實已經靜咗）就 call done()
let retried = false;
function speakOne(text, done, lang = "ja") {
  if (!voice.ja && !voice.en) pickVoice();   // 有啲瀏覽器頭一次撳先載入語音
  const u = new SpeechSynthesisUtterance(lang === "ja" ? speechText(text) : text);
  u.lang = lang === "ja" ? "ja-JP" : "en-GB";
  if (voice[lang]) u.voice = voice[lang];
  u.rate = rate;
  current = u;

  let finished = false;
  let started = false;
  let tStart = Date.now();
  const t0 = Date.now();
  const finish = () => {
    if (finished) return;
    finished = true;
    clearWatchdog();
    done(Date.now() - tStart);   // 傳返讀咗幾耐（跟讀模式用）
  };
  u.onstart = () => { started = true; tStart = Date.now(); showStatus(""); };
  u.onend = finish;
  u.onerror = e => {
    const err = e && e.error;
    if (err === "interrupted" || err === "canceled") return finish();   // 自己撳停，唔係出錯
    // 揀咗嘅語音用唔到（例如要上網嘅 Google 語音）：唔指定語音，交返俾瀏覽器揀，再試一次
    if (u.voice && !retried) {
      retried = true;
      voice[lang] = null;
      clearWatchdog();
      return speakOne(text, done, lang);
    }
    showStatus(`朗讀出錯（${err || "unknown"}）。撳上面「🔈 測試聲音」睇吓詳情。`);
    finish();
  };

  // 後備：有啲瀏覽器唔會觸發 onend，就自己睇吓引擎係咪已經靜咗
  clearWatchdog();
  watchdog = setInterval(() => {
    const busy = synth.speaking || synth.pending;
    if (!busy && (started || Date.now() - t0 > 3000)) finish();
  }, 300);

  try { if (synth.paused) synth.resume(); } catch (e) {}   // Chrome 有時會卡咗喺「暫停」狀態
  synth.speak(u);
}

function setPlaying(on) {
  const play = document.getElementById("play");
  if (play) play.textContent = on ? "⟳ 由頭再讀" : "▶︎ 讀全篇";
  document.body.classList.toggle("playing", on);
}

// 停低而家讀緊嘅嘢（cancel = 要唔要叫語音引擎停）
function halt(cancel = true) {
  playId++;
  clearWatchdog();
  current = null;
  if (synth && cancel) synth.cancel();
  document.querySelectorAll(".passage .s.on").forEach(el => el.classList.remove("on"));
  setPlaying(false);
}

// 「停」掣：停低，iPhone 有時 cancel 一次唔停，再補多一次。
// 補嗰下只會喺之後冇再撳過「讀」先做，唔係就會將啱啱開始讀嗰句都 cancel 埋（以前冇聲就係因為咁）。
function stopAll() {
  halt();
  if (synth) {
    const id = playId;
    setTimeout(() => { if (id === playId) synth.cancel(); }, 50);
  }
}

// 讀一串句子（each = 每句開始前 call，用嚟 highlight；pause = 每句之後停一停俾人跟讀）
function playQueue(texts, each, lang = "ja", pause = false) {
  if (!synth) return;
  const wasBusy = synth.speaking || synth.pending;
  retried = false;
  halt(wasBusy);                             // 本身靜就唔使 cancel，即刻讀
  const id = playId;
  setPlaying(true);

  const step = i => {
    if (id !== playId) return;               // 已經撳咗停／再撳過讀
    if (i >= texts.length) { halt(false); return; }
    if (each) each(i);
    speakOne(texts[i], ms => {
      if (!pause || i === texts.length - 1) return step(i + 1);
      // 跟讀：停大約同一句咁長（再加少少），然後先讀下一句
      setTimeout(() => step(i + 1), Math.min(12000, Math.max(1500, ms * 1.3 + 600)));
    }, lang);
  };
  // 啱啱 cancel 完要等一陣先讀，否則 Safari 會食咗第一句；
  // 本身靜嘅話就即刻讀（iPhone 要喺撳掣嗰下開始讀先有聲）
  if (wasBusy) {
    setTimeout(() => { if (id === playId) synth.cancel(); }, 50);   // iPhone：補多一下 cancel
    setTimeout(() => step(0), 250);
  } else step(0);
}

// 由第 start 句開始逐句讀，讀緊嗰句會 highlight
function readPassage(start = 0) {
  const box = document.querySelector(".passage");
  const lang = box?.dataset.lang || "ja";
  const spans = [...box.querySelectorAll(".s")].slice(start);
  playQueue(spans.map(s => s.dataset.text), i => {
    document.querySelectorAll(".passage .s.on").forEach(el => el.classList.remove("on"));
    spans[i].classList.add("on");
  }, lang, shadow);
}

function speak(text, lang = "ja") { playQueue([text], null, lang); }

// ---------- 共用 ----------
const speakBtn = (text, lang = "ja") =>
  `<button class="speak" title="朗讀" data-say="${esc(text)}" data-lang="${lang}">🔊</button>`;
const plain = text => text.replace(FURI_RE, "$1");          // 去走讀音：「花火（はなび）」→「花火」
const lessons = (window.LESSONS || []).slice().sort((a, b) => a.date.localeCompare(b.date)); // 舊 → 新
const byDate = Object.fromEntries(lessons.map(l => [l.date, l]));
const view = document.getElementById("view");
const DOW = ["日", "一", "二", "三", "四", "五", "六"];

function todayLondon() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/London" }).format(new Date());
}
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;

// ---------- JLPT N3 文法清單 ----------
const N3 = (window.N3 || []).map(([no, point, meaning, form, ja, zh]) => ({ no, point, meaning, form, ja, zh }));
const n3ByNo = Object.fromEntries(N3.map(g => [g.no, g]));
const n3Lesson = Object.fromEntries(lessons.filter(l => l.n3).map(l => [l.n3, l]));

function n3Section() {
  if (!N3.length) return "";
  const done = N3.filter(g => n3Lesson[g.no]).length;
  const next = N3.find(g => !n3Lesson[g.no]);
  const pct = Math.round(done / N3.length * 100);
  return `<section>
      <h2>JLPT N3 文法（${N3[0].no}–${N3[N3.length - 1].no}）</h2>
      <div class="muted">已學 <b>${done}</b>／${N3.length}${next ? `　下一個：${esc(next.point)}（#${next.no}）` : "　全部學完 🎉"}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <details>
        <summary>睇全部 ${N3.length} 個文法</summary>
        <div class="n3">${N3.map(g => {
          const l = n3Lesson[g.no];
          const name = l ? `<a class="done" href="#${l.date}">✓ ${esc(g.point)}</a>` : esc(g.point);
          return `<span class="no">${g.no}</span><span class="${next === g ? "next" : ""}">${name}</span><span class="m">${esc(g.meaning)}</span>`;
        }).join("")}</div>
      </details>
    </section>`;
}

// 每日頁：課本嗰張表嘅原本解釋同例句
function n3Ref(no) {
  const g = n3ByNo[no];
  if (!g) return "";
  return `<div class="ref">
      <b>📘 N3 文法表 #${g.no}：${esc(g.point)}</b>
      <div class="muted">意思：${esc(g.meaning)}　接續：${esc(g.form)}</div>
      <div>${esc(g.ja)} ${speakBtn(g.ja)}</div>
      <div class="muted">${esc(g.zh)}</div>
    </div>`;
}

// ---------- 首頁：月曆 ----------
function monthsAvailable() {
  const set = new Set(lessons.map(l => l.date.slice(0, 7)));
  set.add(todayLondon().slice(0, 7));
  return [...set].sort();
}

function renderCalendar(month) {
  const months = monthsAvailable();
  if (!months.includes(month)) month = months[months.length - 1];
  const idx = months.indexOf(month);
  const [y, m] = month.split("-").map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1));
  const last = new Date(Date.UTC(y, m, 0));
  const today = todayLondon();

  // 由包含 1 號嗰個星期嘅星期一開始（1 號係六日就由下個星期一開始）
  let start = new Date(first);
  const wd = first.getUTCDay();
  if (wd === 0) start.setUTCDate(2);
  else if (wd === 6) start.setUTCDate(3);
  else start.setUTCDate(1 - (wd - 1));

  let cells = "";
  for (let wk = new Date(start); wk <= last; wk.setUTCDate(wk.getUTCDate() + 7)) {
    for (let i = 0; i < 5; i++) {
      const d = new Date(wk); d.setUTCDate(wk.getUTCDate() + i);
      const key = ymd(d);
      const inMonth = d.getUTCMonth() === m - 1;
      const l = byDate[key];
      const cls = ["cell", inMonth ? "" : "out", l ? "done" : "", key === today ? "today" : ""].join(" ");
      if (l && inMonth) {
        cells += `<a class="${cls}" href="#${key}"><span class="d">${d.getUTCDate()}</span>
          <span class="t">${esc(plain(l.title))}</span>${l.en ? `<span class="e">🇬🇧 ${esc(l.en.title)}</span>` : ""}
          <span class="g">${esc(l.grammar.point)}</span></a>`;
      } else {
        cells += `<div class="${cls}"><span class="d">${d.getUTCDate()}</span></div>`;
      }
    }
  }

  const words = lessons.reduce((n, l) => n + l.vocab.length, 0);
  const newest = lessons.slice().reverse();

  view.innerHTML = `
    <section>
      <div class="cal-head">
        <button id="prevM" ${idx === 0 ? "disabled" : ""} aria-label="上個月">‹</button>
        <h2>${y}年${m}月</h2>
        <button id="nextM" ${idx === months.length - 1 ? "disabled" : ""} aria-label="下個月">›</button>
      </div>
      <div class="cal">
        ${["一", "二", "三", "四", "五"].map(d => `<div class="dow">${d}</div>`).join("")}
        ${cells}
      </div>
      <p class="muted" style="margin:10px 0 0">撳有 🌸 嘅日子入去睇嗰日嘅練習。星期六日休息。</p>
    </section>

    <section class="stats">
      <div><b>${lessons.length}</b> 日練習</div>
      <div><b>${words}</b> 個詞彙</div>
      <div><b>${lessons.length}</b> 個文法</div>
    </section>
    ${n3Section()}

    <section>
      <h2>全部練習</h2>
      <div class="list">${newest.map(l => `
        <a href="#${l.date}"><span class="dt">${Number(l.date.slice(5, 7))}/${Number(l.date.slice(8))}（${esc(l.weekday)}）</span>
          <span>${esc(plain(l.title))}${l.en ? `<span class="en-title">${esc(l.en.title)}</span>` : ""}</span>
          <span class="gp">${esc(l.grammar.point)}</span></a>`).join("")}
      </div>
    </section>`;

  document.getElementById("prevM").onclick = () => { location.hash = "m-" + months[idx - 1]; };
  document.getElementById("nextM").onclick = () => { location.hash = "m-" + months[idx + 1]; };
  document.title = "日本語練習";
}

// ---------- 每日頁 ----------
function navBar(lesson, tab = "ja") {
  const i = lessons.indexOf(lesson);
  const prev = lessons[i - 1], next = lessons[i + 1];
  // 喺英文版撳前／後一日，有英文就留喺英文版
  const link = l => `#${l.date}${tab === "en" && l.en ? "/en" : ""}`;
  return `<div class="nav">
    <a href="#m-${lesson.date.slice(0, 7)}">← 月曆</a>
    <div style="display:flex;gap:8px">
      ${prev ? `<a href="${link(prev)}">‹ ${Number(prev.date.slice(5, 7))}/${Number(prev.date.slice(8))}</a>` : `<span>‹</span>`}
      ${next ? `<a href="${link(next)}">${Number(next.date.slice(5, 7))}/${Number(next.date.slice(8))} ›</a>` : `<span>›</span>`}
    </div>
  </div>`;
}

// 短文 + 朗讀掣（日文、英文共用）
function readerSection(title, passage, lang) {
  const sents = sentences(passage, lang);
  const fmt = lang === "ja" ? ruby : esc;
  return `
      <h2>${title}</h2>
      <div class="controls">
        <button class="primary" id="play">▶︎ 讀全篇</button>
        <button id="stop">■ 停</button>
        <label>速度 <input type="range" id="rate" min="0.5" max="1.3" step="0.1" value="${rate}">
          <span id="rateVal">${rate.toFixed(1)}×</span></label>
        <label><input type="checkbox" id="shadow" ${shadow ? "checked" : ""}> 跟讀模式</label>
        ${lang === "en" ? `<span id="voiceMenu">${voiceMenu()}</span>` : ""}
      </div>
      <div class="passage ${lang}" data-lang="${lang}" ${lang === "en" ? 'lang="en-GB"' : ""}>${sents.map((s, i) =>
        `<span class="s" data-i="${i}" data-text="${esc(s)}">${fmt(s)}</span>`).join(lang === "en" ? " " : "")}</div>
      <p class="muted">撳任何一句就由嗰句開始讀。開咗「跟讀模式」會每句讀完停一停，等你跟住講（shadowing）。</p>`;
}

function headSection(lesson, tab) {
  const tabs = lesson.en ? `
    <div class="tabs">
      <a href="#${lesson.date}" class="${tab === "ja" ? "on" : ""}">🇯🇵 日本語</a>
      <a href="#${lesson.date}/en" class="${tab === "en" ? "on" : ""}">🇬🇧 English</a>
    </div>` : "";
  return `
    <section>
      <h2>${esc(lesson.date)}（${esc(lesson.weekday)}）${ruby(lesson.title)}
        ${lesson.en ? `<span class="en-title" lang="en-GB">${esc(lesson.en.title)}</span>` : ""}</h2>
      <div>${ruby(tab === "en" && lesson.en.intro ? lesson.en.intro : lesson.intro)}</div>
      ${tabs}
    </section>`;
}

function renderEnglish(lesson) {
  const en = lesson.en;
  view.innerHTML = `
    ${navBar(lesson)}
    ${headSection(lesson, "en")}

    <section>
      ${readerSection("Reading（英式英文）", en.passage, "en")}
      ${en.questions?.length ? `<b>Questions</b>
      <ol lang="en-GB">${en.questions.map(([q]) => `<li>${esc(q)} ${speakBtn(q, "en")}</li>`).join("")}</ol>` : ""}
    </section>

    <section>
      <h2>Vocabulary</h2>
      <table lang="en-GB">
        <tr><th>English</th><th>意思</th><th></th></tr>
        ${en.vocab.map(([w, m]) =>
          `<tr><td>${esc(w)}</td><td>${esc(m)}</td><td>${speakBtn(w, "en")}</td></tr>`).join("")}
      </table>
    </section>

    ${en.phrase ? `<section>
      <h2>Phrase：${esc(en.phrase.point)}</h2>
      ${en.phrase.explain.map(p => `<div>${esc(p)}</div>`).join("")}
      <ol>${en.phrase.examples.map(([e, yue]) =>
        `<li lang="en-GB">${esc(e)} ${speakBtn(e, "en")}<br><span class="muted" lang="zh-Hant-HK">${esc(yue || "")}</span></li>`).join("")}</ol>
    </section>` : ""}

    ${en.questions?.length ? `<section>
      <h2>答案</h2>
      <details>
        <summary>撳嚟睇答案（做完先睇！）</summary>
        <ul lang="en-GB">${en.questions.map(([, a], i) => `<li>Q${i + 1}：${esc(a)} ${speakBtn(a, "en")}</li>`).join("")}</ul>
      </details>
    </section>` : ""}
    ${navBar(lesson, "en")}`;
  wireReader();
  document.title = `${en.title}｜English`;
}

function wireVoiceMenu() {
  const sel = document.getElementById("enVoice");
  if (!sel) return;
  sel.onchange = () => {
    voice.en = enVoices().find(v => v.name === sel.value) || voice.en;
    try { localStorage.setItem("enVoice", sel.value); } catch (e) {}
    speak("Hello, lovely to meet you.", "en");   // 試聽
  };
}
// 語音遲咗載入（Chrome 常見）：載入完再整返個選單
function refreshVoiceMenu() {
  const box = document.getElementById("voiceMenu");
  if (box) { box.innerHTML = voiceMenu(); wireVoiceMenu(); }
}

function wireReader() {
  document.getElementById("play").onclick = () => readPassage(0);
  document.getElementById("stop").onclick = stopAll;
  document.getElementById("rate").oninput = e => {
    rate = parseFloat(e.target.value);
    document.getElementById("rateVal").textContent = rate.toFixed(1) + "×";
  };
  document.getElementById("shadow").onchange = e => { shadow = e.target.checked; };
  wireVoiceMenu();
  view.querySelectorAll(".passage .s").forEach(s =>
    s.onclick = () => readPassage(parseInt(s.dataset.i, 10)));
}

function renderLesson(lesson) {
  view.innerHTML = `
    ${navBar(lesson)}
    ${headSection(lesson, "ja")}

    <section>
      ${readerSection("短文閱讀", lesson.passage, "ja")}
      <b>問題</b>
      <ol>${lesson.questions.map(([q]) => `<li>${ruby(q)} ${speakBtn(q)}</li>`).join("")}</ol>
    </section>

    <section>
      <h2>詞彙</h2>
      <table>
        <tr><th>日文</th><th>讀音</th><th>意思</th><th></th></tr>
        ${lesson.vocab.map(([w, r, m]) =>
          `<tr><td>${esc(w)}</td><td>${esc(r)}</td><td>${esc(m)}</td><td>${speakBtn(r)}</td></tr>`).join("")}
      </table>
    </section>

    <section>
      <h2>文法：${esc(lesson.grammar.point)}${n3ByNo[lesson.n3] ? `<span class="badge">N3 #${lesson.n3}</span>` : ""}</h2>
      ${lesson.grammar.explain.map(p => `<div>${ruby(p)}</div>`).join("")}
      <ol>${lesson.grammar.examples.map(([jp, yue]) =>
        `<li>${ruby(jp)} ${speakBtn(jp)}<br><span class="muted">${esc(yue || "")}</span></li>`).join("")}</ol>
      ${n3Ref(lesson.n3)}
    </section>

    <section>
      <h2>練習</h2>
      <ol>${lesson.exercises.map(([q]) => `<li>${ruby(q)}</li>`).join("")}</ol>
    </section>

    <section>
      <h2>挑戰</h2>
      <div>${ruby(lesson.challenge)}</div>
    </section>

    <section>
      <h2>答案</h2>
      <details>
        <summary>撳嚟睇答案（做完先睇！）</summary>
        <ul>
          ${lesson.questions.map(([, a], i) => `<li>閱讀 ${i + 1}：${ruby(a)} ${speakBtn(a)}</li>`).join("")}
          ${lesson.exercises.map(([, a], i) => `<li>練習 ${i + 1}：${ruby(a)}</li>`).join("")}
        </ul>
      </details>
    </section>
    ${navBar(lesson)}`;

  wireReader();
  document.title = `${plain(lesson.title)}｜日本語練習`;
}

// ---------- 路由：#  = 月曆，#m-2026-10 = 指定月份，#2026-10-07 = 嗰日 ----------
function route() {
  stopAll();
  const h = decodeURIComponent(location.hash.slice(1));
  const [day, tab] = h.split("/");
  if (byDate[day] && tab === "en" && byDate[day].en) renderEnglish(byDate[day]);
  else if (byDate[day]) renderLesson(byDate[day]);
  else if (/^m-\d{4}-\d{2}$/.test(h)) renderCalendar(h.slice(2));
  else renderCalendar(todayLondon().slice(0, 7));
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();

// 🔊 掣（詞彙、例句、答案）
document.addEventListener("click", e => {
  const b = e.target.closest("[data-say]");
  if (b) speak(b.dataset.say, b.dataset.lang || "ja");
});

// ---------- 聲音測試 / 出錯提示 ----------
function showStatus(msg) {
  const el = document.getElementById("speechStatus");
  if (!el) return;
  el.hidden = !msg;
  el.innerHTML = msg;
}
document.getElementById("testVoice").onclick = () => {
  if (!synth) return showStatus("呢個瀏覽器唔支援朗讀（冇 speechSynthesis）。試吓用 Chrome、Edge 或 Safari 直接開個網頁。");
  pickVoice();
  const all = synth.getVoices();
  const ja = all.filter(v => /^ja/i.test(v.lang)).length;
  const en = all.filter(v => /^en/i.test(v.lang)).length;
  const inFrame = window.top !== window.self;
  showStatus(`語音數目：全部 ${all.length}，日文 ${ja}，英文 ${en}<br>
    日文用：${esc(voice.ja ? voice.ja.name : "（瀏覽器預設）")}；英文用：${esc(voice.en ? voice.en.name : "（瀏覽器預設）")}<br>
    ${all.length === 0 ? "⚠️ 呢部機／瀏覽器冇任何語音，所以冇聲。<br>" : ""}
    ${inFrame ? "⚠️ 網頁而家喺另一個 app 嘅預覽入面開，可能會被禁止出聲。試吓用 Safari／Chrome 直接開網址。<br>" : ""}
    依家讀緊「こんにちは。Hello.」——聽唔到嘅話：檢查音量、iPhone 側邊靜音掣，同埋將截圖俾我睇。`);
  retried = false;
  halt(synth.speaking || synth.pending);
  const id = playId;
  speakOne("こんにちは。", () => { if (id === playId) speakOne("Hello.", () => halt(false), "en"); }, "ja");
};

document.getElementById("furi").onchange = e =>
  document.body.classList.toggle("no-furigana", !e.target.checked);

// ---------- 飄落嘅櫻花瓣 ----------
(function petals() {
  const scene = document.querySelector(".scene");
  const n = window.innerWidth < 500 ? 10 : 18;
  for (let i = 0; i < n; i++) {
    const p = document.createElement("div");
    p.className = "petal";
    const size = 8 + Math.random() * 8;
    p.style.left = Math.random() * 100 + "vw";
    p.style.width = size + "px";
    p.style.height = size * 0.8 + "px";
    p.style.animationDuration = 10 + Math.random() * 12 + "s";
    p.style.animationDelay = -Math.random() * 20 + "s";
    p.style.opacity = 0.5 + Math.random() * 0.4;
    scene.appendChild(p);
  }
})();
