<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本語練習</title>
<style>
  :root {
    --bg: #faf8f4; --card: #ffffff; --ink: #1f1d1a; --muted: #6b665e;
    --line: #e6e1d8; --accent: #b4442f; --hl: #fde9a9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171614; --card: #211f1c; --ink: #ece8e1; --muted: #a39d93;
            --line: #36332e; --accent: #e4775f; --hl: #5a4a12; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.75 "Hiragino Sans", "Noto Sans JP", "Noto Sans TC", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  h1 { font-size: 1.4rem; margin: 8px 0; }
  h2 { font-size: 1.1rem; margin: 0 0 8px; color: var(--accent); }
  select, button, input { font: inherit; }
  select { max-width: 100%; }
  select, button { border: 1px solid var(--line); background: var(--card); color: var(--ink);
                   border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
            padding: 16px; margin: 14px 0; }
  .muted { color: var(--muted); font-size: .9rem; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border-bottom: 1px solid var(--line); padding: 6px 4px; text-align: left; vertical-align: top; }
  .speak { border: none; background: none; padding: 0 4px; cursor: pointer; font-size: 1rem; }
  rt { font-size: .55em; color: var(--muted); }
  body.no-furigana rt { display: none; }
  .passage .s { cursor: pointer; border-radius: 4px; transition: background .2s; }
  .passage .s:hover { background: color-mix(in srgb, var(--hl) 50%, transparent); }
  .passage .s.on { background: var(--hl); }
  .passage { font-size: 1.15rem; line-height: 2.3; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .controls label { display: flex; gap: 6px; align-items: center; font-size: .9rem; }
  ol { padding-left: 1.4em; margin: 6px 0; }
  li { margin: 4px 0; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--accent); }
  .warn { background: #fff3cd; color: #5c4400; padding: 8px 12px; border-radius: 8px; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>日本語練習</h1>
    <div class="controls">
      <select id="day" aria-label="揀日子"></select>
      <label><input type="checkbox" id="furi" checked> 振假名</label>
    </div>
  </header>

  <div id="nospeech" class="warn" hidden>呢個瀏覽器唔支援朗讀（Web Speech API）。試吓用 Chrome、Edge 或 Safari。</div>
  <div id="lesson"></div>
</main>

<script src="data/lessons.js"></script>
<script>
// ---------- 振假名 / 朗讀用文字 ----------
const KANJI = "[\\u4E00-\\u9FFF\\u3400-\\u4DBF々〆ヶ]";
const READ = "[\\u3041-\\u3096ー]";
const FURI_RE = new RegExp(`(${KANJI}+)（(${READ}+)）`, "g");

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// 「花火（はなび）」→ <ruby>花火<rt>はなび</rt></ruby>
function ruby(text) {
  return esc(text).replace(FURI_RE, "<ruby>$1<rt>$2</rt></ruby>");
}
// 朗讀時用括號入面嘅讀音代替漢字，發音會更準：「花火（はなび）」→「はなび」
function speechText(text) {
  return text.replace(FURI_RE, "$2");
}
// 用「。」「！」「？」分句
function sentences(text) {
  return text.match(/[^。！？]+[。！？]?/g)?.map(s => s.trim()).filter(Boolean) ?? [];
}

// ---------- 朗讀 ----------
const synth = window.speechSynthesis;
let jaVoice = null;
let rate = 0.9;

function pickVoice() {
  if (!synth) return;
  const voices = synth.getVoices().filter(v => v.lang.replace("_", "-").toLowerCase().startsWith("ja"));
  jaVoice = voices.find(v => /google|kyoko|otoya|nanami|haruka/i.test(v.name)) || voices[0] || null;
}
if (synth) {
  pickVoice();
  synth.onvoiceschanged = pickVoice;
} else {
  document.getElementById("nospeech").hidden = false;
}

function speak(text, { onstart, onend } = {}) {
  if (!synth) return;
  const u = new SpeechSynthesisUtterance(speechText(text));
  u.lang = "ja-JP";
  if (jaVoice) u.voice = jaVoice;
  u.rate = rate;
  if (onstart) u.onstart = onstart;
  if (onend) { u.onend = onend; u.onerror = onend; }
  synth.speak(u);
}

function stopAll() {
  if (synth) synth.cancel();
  document.querySelectorAll(".passage .s.on").forEach(el => el.classList.remove("on"));
}

// 由第 start 句開始逐句讀，讀緊嗰句會highlight
function readPassage(start = 0) {
  stopAll();
  const spans = [...document.querySelectorAll(".passage .s")];
  spans.slice(start).forEach(el => {
    speak(el.dataset.text, {
      onstart: () => { spans.forEach(s => s.classList.remove("on")); el.classList.add("on"); },
      onend: () => el.classList.remove("on")
    });
  });
}

// ---------- 畫面 ----------
const speakBtn = text => `<button class="speak" title="朗讀" data-say="${esc(text)}">🔊</button>`;

function render(lesson) {
  stopAll();
  const sents = sentences(lesson.passage);
  const el = document.getElementById("lesson");
  el.innerHTML = `
    <section>
      <h2>${esc(lesson.date)}（${esc(lesson.weekday)}）${ruby(lesson.title)}</h2>
      <div>${ruby(lesson.intro)}</div>
    </section>

    <section>
      <h2>短文閱讀</h2>
      <div class="controls">
        <button class="primary" id="play">▶︎ 讀全篇</button>
        <button id="stop">■ 停</button>
        <label>速度 <input type="range" id="rate" min="0.5" max="1.3" step="0.1" value="${rate}">
          <span id="rateVal">${rate.toFixed(1)}×</span></label>
      </div>
      <div class="passage">${sents.map((s, i) =>
        `<span class="s" data-i="${i}" data-text="${esc(s)}">${ruby(s)}</span>`).join("")}</div>
      <p class="muted">撳任何一句就由嗰句開始讀。</p>
      <b>問題</b>
      <ol>${lesson.questions.map(([q]) => `<li>${ruby(q)} ${speakBtn(q)}</li>`).join("")}</ol>
    </section>

    <section>
      <h2>詞彙</h2>
      <table>
        <tr><th>日文</th><th>讀音</th><th>意思</th><th></th></tr>
        ${lesson.vocab.map(([w, r, m]) =>
          `<tr><td>${esc(w)}</td><td>${esc(r)}</td><td>${esc(m)}</td><td>${speakBtn(r)}</td></tr>`).join("")}
      </table>
    </section>

    <section>
      <h2>文法：${esc(lesson.grammar.point)}</h2>
      ${lesson.grammar.explain.map(p => `<div>${esc(p)}</div>`).join("")}
      <ol>${lesson.grammar.examples.map(([jp, yue]) =>
        `<li>${ruby(jp)} ${speakBtn(jp)}<br><span class="muted">${esc(yue)}</span></li>`).join("")}</ol>
    </section>

    <section>
      <h2>練習</h2>
      <ol>${lesson.exercises.map(([q]) => `<li>${ruby(q)}</li>`).join("")}</ol>
    </section>

    <section>
      <h2>挑戰</h2>
      <div>${esc(lesson.challenge)}</div>
    </section>

    <section>
      <h2>答案</h2>
      <details>
        <summary>撳嚟睇答案（做完先睇！）</summary>
        <ul>
          ${lesson.questions.map(([, a], i) => `<li>閱讀 ${i + 1}：${ruby(a)} ${speakBtn(a)}</li>`).join("")}
          ${lesson.exercises.map(([, a], i) => `<li>練習 ${i + 1}：${ruby(a)}</li>`).join("")}
        </ul>
      </details>
    </section>`;

  document.getElementById("play").onclick = () => readPassage(0);
  document.getElementById("stop").onclick = stopAll;
  document.getElementById("rate").oninput = e => {
    rate = parseFloat(e.target.value);
    document.getElementById("rateVal").textContent = rate.toFixed(1) + "×";
  };
  el.querySelectorAll(".passage .s").forEach(s =>
    s.onclick = () => readPassage(parseInt(s.dataset.i, 10)));
}

// 🔊 掣（詞彙、例句、答案）
document.addEventListener("click", e => {
  const b = e.target.closest("[data-say]");
  if (b) { stopAll(); speak(b.dataset.say); }
});

// 揀日子
const sel = document.getElementById("day");
const lessons = window.LESSONS || [];
sel.innerHTML = lessons.map((l, i) =>
  `<option value="${i}">${esc(l.date)} ${esc(speechText(l.title))}</option>`).join("");
const fromHash = lessons.findIndex(l => l.date === location.hash.slice(1));
sel.value = fromHash >= 0 ? fromHash : 0;
sel.onchange = () => { const l = lessons[sel.value]; location.hash = l.date; render(l); };
if (lessons.length) render(lessons[sel.value]);

document.getElementById("furi").onchange = e =>
  document.body.classList.toggle("no-furigana", !e.target.checked);
</script>
</body>
</html>
